[project]
name = "holder-boost"
version = "0.1.0"
description = "Polymarket No-outcome screening and analysis"
readme = "README.md"
authors = [
    { name = "alexanderpo", email = "alexander.pozhidaev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "typer>=0.25.0",
]

[project.scripts]
holder-boost = "holder_boost.cli.main:app"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
ml = [
    "catboost>=1.2.8",
    "fastapi>=0.115.0",
    "joblib>=1.5.0",
    "numpy>=2.2.0",
    "optuna>=4.3.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.6.0",
    "uvicorn[standard]>=0.32.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
